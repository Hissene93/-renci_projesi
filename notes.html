{% extends 'base.html' %}
{% block content %}
<h2>Liste des notes</h2>
<a href="{{ url_for('ajouter_note') }}">Ajouter une note</a>
<ul>
    {% for n in notes %}
    <li>{{ n.etudiant }} – {{ n.cours }} : {{ n.note }}</li>
    {% endfor %}
</ul>
{% if not notes %}
<p>Aucune note enregistrée.</p>
{% endif %}
{% endblock %}
